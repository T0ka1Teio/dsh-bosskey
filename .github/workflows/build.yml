name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish -c Release -r win-x64
          -p:SelfContained=true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev" }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/DSH-BossKey.exe pkg/
          Copy-Item LICENSE pkg/LICENSE.txt
          Compress-Archive -Path pkg/* -DestinationPath "DSH-BossKey-$version-win-x64.zip"
          "ASSET=DSH-BossKey-$version-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-BossKey-win-x64
          path: ${{ env.ASSET }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
