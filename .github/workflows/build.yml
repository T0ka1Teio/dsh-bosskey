name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish -c Release -r win-x64
          -p:SelfContained=false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o dist

      - name: Show size
        shell: pwsh
        run: Get-Item dist/DSH-BossKey.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-BossKey-win-x64
          path: dist/DSH-BossKey.exe
